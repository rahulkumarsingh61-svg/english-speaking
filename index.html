<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BolEnglish AI Tutor</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --orange: #fb923c;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Top App Bar */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-title .bol { color: var(--orange); }
    .brand-title .eng { color: var(--accent); }

    .status-badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* Conversation Area */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user-msg {
      background: #2563eb;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .ai-msg {
      background: var(--card-bg);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .ai-msg strong {
      color: var(--orange);
    }

    .msg-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }

    .speak-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Bottom Input Bar */
    .input-bar {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #user-input {
      flex: 1;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 12px 18px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    #user-input:focus {
      border-color: var(--accent);
    }

    .btn-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    #mic-btn {
      background: #334155;
      color: #fff;
    }

    #mic-btn.listening {
      background: #dc2626;
      animation: pulse 1.2s infinite;
    }

    #send-btn {
      background: var(--accent);
      color: #0f172a;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span class="bol">Bol</span><span class="eng">English</span>
    </div>
    <span class="status-badge">AI Active</span>
  </header>

  <div id="chat-box">
    <div class="message ai-msg">
      👋 Namaste! I am your <strong>BolEnglish</strong> AI tutor.<br>
      Aap mujhse English seekh sakte hain, sentence correct karwa sakte hain, ya conversation practice kar sakte hain.<br><br>
      <em>Bol kar ya type karke shuru karein!</em>
    </div>
  </div>

  <div class="input-bar">
    <button id="mic-btn" class="btn-circle" title="Speak">🎙️</button>
    <input type="text" id="user-input" placeholder="Bol kar ya type karke likhein..." autocomplete="off" />
    <button id="send-btn" class="btn-circle" title="Send">➤</button>
  </div>

  <script>
    // -------------------------------------------------------------
    // REPLACE THIS WITH YOUR FREE CLOUDFLARE WORKER URL:
    const PROXY_URL = "https://bolenglish-api.yourname.workers.dev";
    // -------------------------------------------------------------

    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");

    const conversationHistory = [
      {
        role: "system",
        content: `You are BolEnglish, an encouraging bilingual English tutor for Hindi & Hinglish speakers.
- Always correct grammar errors with clear Hinglish explanations.
- Provide the corrected version first.
- Keep responses conversational, concise, and easy to pronounce.`
      }
    ];

    function appendMessage(sender, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${sender === "user" ? "user-msg" : "ai-msg"}`;
      
      if (sender === "ai") {
        msgDiv.innerHTML = text.replace(/\n/g, "<br>");
        
        const actionArea = document.createElement("div");
        actionArea.className = "msg-actions";
        
        const speakBtn = document.createElement("button");
        speakBtn.className = "speak-btn";
        speakBtn.innerHTML = "🔊 Listen";
        speakBtn.onclick = () => speakEnglish(text);
        
        actionArea.appendChild(speakBtn);
        msgDiv.appendChild(actionArea);
      } else {
        msgDiv.innerText = text;
      }

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";
      conversationHistory.push({ role: "user", content: text });

      appendMessage("ai", "Thinking...");

      try {
        const response = await fetch(PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: conversationHistory })
        });

        const data = await response.json();
        const reply = data.choices[0].message.content;

        // Replace 'Thinking...' placeholder
        chatBox.lastElementChild.remove();
        appendMessage("ai", reply);
        conversationHistory.push({ role: "assistant", content: reply });
      } catch (err) {
        chatBox.lastElementChild.remove();
        appendMessage("ai", "⚠️ Connection error. Please verify your internet connection.");
      }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSend();
    });

    // Native Speech Synthesis (Audio Output)
    function speakEnglish(rawText) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();

      // Clean HTML tags and special characters
      const cleanText = rawText.replace(/<[^>]*>?/gm, "").split("💡")[0];
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = "en-US";
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    // Native Speech Recognition (Voice Input)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognizer = new SpeechRecognition();
      recognizer.lang = "en-IN";
      recognizer.interimResults = false;

      recognizer.onstart = () => micBtn.classList.add("listening");
      recognizer.onend = () => micBtn.classList.remove("listening");
      recognizer.onerror = () => micBtn.classList.remove("listening");
      recognizer.onresult = (e) => {
        userInput.value = e.results[0][0].transcript;
        handleSend();
      };

      micBtn.addEventListener("click", () => {
        try { recognizer.start(); } catch (e) { recognizer.stop(); }
      });
    } else {
      micBtn.style.display = "none";
    }
  </script>
</body>
</html>
